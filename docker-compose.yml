# Développement : seule la base tourne dans Docker.
# L'API et le frontend se lancent avec `npm run dev` pour garder le
# rechargement à chaud. Pour une pile complète en conteneurs, voir
# docker-compose.prod.yml.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mediquip}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mediquip}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
